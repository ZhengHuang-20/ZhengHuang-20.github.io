<!DOCTYPE html>
<html lang="zh-Hans">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Chants of the Verse (Chapter I)</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: #2a1d14; overflow: hidden; touch-action: none; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans', Arial, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status, #rotate { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
#status { background: radial-gradient(ellipse at 50% 40%, #4a3322 0%, #2a1d14 75%); visibility: hidden; z-index: 5; }
#status h1 { margin: 0 0 6px; font-size: 34px; font-weight: 700; color: #f4e7c8; letter-spacing: 1px; }
#status .flame { width: 28px; height: 44px; margin-bottom: 14px; background: radial-gradient(ellipse at 50% 70%, #fff3b0 0%, #ffb23a 45%, #ff7a2a 100%); border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%; animation: flick 1.2s ease-in-out infinite; }
@keyframes flick { 0%,100% { transform: scale(1, 1) rotate(-2deg); } 50% { transform: scale(0.92, 1.1) rotate(2deg); } }
#status .msg { font-size: 22px; color: #e3cf9c; margin-bottom: 18px; }
#status-progress { display: none; align-items: center; gap: 12px; width: min(420px, 70vw); }
#status-track { flex: 1; height: 14px; border-radius: 7px; background: #5a3d27; border: 2px solid #8a6a43; overflow: hidden; box-sizing: content-box; }
#status-bar { height: 100%; width: 0; background: #d6a23c; transition: width 0.2s; }
#status-bar.indeterminate { width: 40%; animation: slide 1.2s linear infinite; }
@keyframes slide { from { margin-left: -40%; } to { margin-left: 100%; } }
#status-pct { min-width: 48px; text-align: right; font-size: 18px; color: #d6a23c; font-variant-numeric: tabular-nums; }
#status .hint { margin-top: 14px; font-size: 14px; color: #8a6a43; }
#status-notice { display: none; background-color: #5b3943; border-radius: 0.5rem; border: 1px solid #9b3943; color: #e0e0e0; line-height: 1.3; margin: 0 2rem; padding: 1rem; }
#rotate { display: none; background: #2a1d14; z-index: 10; padding: 24px; box-sizing: border-box; }
#rotate .phone { width: 64px; height: 108px; border: 5px solid #d6a23c; border-radius: 12px; margin-bottom: 28px; animation: turn 2.4s ease-in-out infinite; }
@keyframes turn { 0%, 20% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
#rotate .zh { font-size: 30px; font-weight: 700; color: #f4e7c8; }
#rotate .en { margin-top: 8px; font-size: 20px; color: #e3cf9c; }
@media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Your browser does not support JavaScript.</noscript>

		<div id="status">
			<div class="flame"></div>
			<h1>Chants of the Verse</h1>
			<div class="msg">加载中… Loading…</div>
			<div id="status-progress"><div id="status-track"><div id="status-bar" class="indeterminate"></div></div><div id="status-pct"></div></div>
			<div class="hint">第一次打开需要几秒钟 · First load takes a few seconds</div>
			<div id="status-notice"></div>
		</div>

		<div id="rotate" role="alert">
			<div class="phone"></div>
			<div class="zh">请横屏游玩</div>
			<div class="en">Rotate your phone</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":22016152,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusBar = document.getElementById('status-bar');
	const statusPct = document.getElementById('status-pct');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round(current / total * 100));
					statusBar.style.width = pct + '%';
					statusBar.classList.remove('indeterminate');
					statusPct.textContent = pct + '%';
				} else {
					statusBar.classList.add('indeterminate');
					statusPct.textContent = '';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
